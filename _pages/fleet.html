priority: 0.95

<div class="projects-intro-wrapper">
  <div class="projects-intro">
    <p class="type-level-1">Ian&nbsp;Burwell</p>
    <p class="type-level-3">Engineer&nbsp;|&nbsp;Programmer&nbsp;|&nbsp;Maker</p>
  </div>
</div> 

<div class="projects">
{% for drone in site.drones reversed limit:include.limit %}
  <article class="project-listing">
    <div class="thumbnail-wrapper">
      <a href="{{ drone.url | prepend: site.baseurl }}">
        <div class="thumbnail-description-wrapper">
          <img src="{{ drone.thumbnail | prepend: site.image_serve_path }}" alt="{{ drone.name }}" width="600" height="450">
          <p class="thumbnail-description">
            <span>{{ drone.description }}</span>
          </p>
        </div>
        <h3 aria-hidden="true">{{ project.title }}</h3>
      </a>
  </div>
  </article>
{% endfor %}
</div>
