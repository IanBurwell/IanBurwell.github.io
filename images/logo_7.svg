<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <style>
    /* Default to light mode */
    #dark { display: none; }
    #light { display: block; }

    @media (prefers-color-scheme: dark) {
      #dark { display: block; }
      #light { display: none; }
    }
  </style>

  <!-- DARK MODE -->
  <g id="dark">
    <rect x="75" y="75" width="350" height="350"
      style="fill: none; stroke-width: 16px; stroke-linecap: round; stroke-linejoin: round; stroke: rgb(241, 241, 241);" />

    <ellipse cx="150" cy="149.981" rx="35.981" ry="35.981" fill="rgb(241,241,241)"/>
    <ellipse cx="250" cy="149.981" rx="35.981" ry="35.981" fill="rgb(241,241,241)"/>
    <ellipse cx="350" cy="149.981" rx="35.981" ry="35.981" fill="rgb(241,241,241)"/>

    <ellipse cx="350" cy="249.981" rx="35.981" ry="35.981" fill="rgba(64,64,64,0.835)"/>
    <ellipse cx="250" cy="249.981" rx="35.981" ry="35.981" fill="rgb(241,241,241)"/>
    <ellipse cx="150" cy="249.981" rx="35.981" ry="35.981" fill="rgba(64,64,64,0.835)"/>

    <ellipse cx="150" cy="349.981" rx="35.981" ry="35.981" fill="rgb(241,241,241)"/>
    <ellipse cx="250.387" cy="349.981" rx="35.981" ry="35.981" fill="rgb(241,241,241)"/>
    <ellipse cx="350" cy="349.981" rx="35.981" ry="35.981" fill="rgb(241,241,241)"/>

    <line x1="75" y1="125" x2="125" y2="75"
      style="stroke-width:16px; stroke-linecap:round; stroke:rgb(241,241,241);" />
  </g>

  <!-- LIGHT MODE -->
  <g id="light">
    <rect x="75" y="75" width="350" height="350"
      style="fill: none; stroke-width: 16px; stroke-linecap: round; stroke-linejoin: round; stroke: rgb(52, 52, 52);" />

    <ellipse cx="150" cy="149.981" rx="35.981" ry="35.981" fill="rgb(52,52,52)"/>
    <ellipse cx="250" cy="149.981" rx="35.981" ry="35.981" fill="rgb(52,52,52)"/>
    <ellipse cx="350" cy="149.981" rx="35.981" ry="35.981" fill="rgb(52,52,52)"/>

    <ellipse cx="350" cy="249.981" rx="35.981" ry="35.981" fill="rgba(241,241,241,0.796)"/>
    <ellipse cx="250" cy="249.981" rx="35.981" ry="35.981" fill="rgb(52,52,52)"/>
    <ellipse cx="150" cy="249.981" rx="35.981" ry="35.981" fill="rgba(241,241,241,0.796)"/>

    <ellipse cx="150" cy="349.981" rx="35.981" ry="35.981" fill="rgb(52,52,52)"/>
    <ellipse cx="250.387" cy="349.981" rx="35.981" ry="35.981" fill="rgb(52,52,52)"/>
    <ellipse cx="350" cy="349.981" rx="35.981" ry="35.981" fill="rgb(52,52,52)"/>

    <line x1="75" y1="125" x2="125" y2="75"
      style="stroke-width:16px; stroke-linecap:round; stroke:rgb(52,52,52);" />
  </g>
</svg>